<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruleta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#FDF8EC; --panel:#FFFFFF; --ink:#17130F; --muted:#6B6558; --line:#17130F;
  --yellow:#FFE44D; --lav:#E9E5FF; --bad-ink:#A3222E;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:600 18px/1.4 var(--body);touch-action:manipulation}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid #6C5CE7;outline-offset:3px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,1fr);gap:24px;
  padding:56px 28px 24px;align-items:center;max-width:1300px;margin:0 auto}
.rueda{position:relative;width:min(100%,72vh);aspect-ratio:1;margin:0 auto}
.rueda svg{width:100%;height:100%;display:block}
#giro{transform-origin:50% 50%}
.flecha{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:0;height:0;
  border-left:22px solid transparent;border-right:22px solid transparent;border-top:40px solid var(--ink);z-index:2}
.flecha::after{content:"";position:absolute;left:-14px;top:-35px;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--yellow)}
.lado{display:flex;flex-direction:column;gap:16px}
h1{font:800 clamp(28px,3.4vw,42px)/1.05 var(--display);margin:0}
.sub{color:var(--muted);margin:0}
.resultado{min-height:150px;display:grid;place-items:center;text-align:center;background:var(--panel);
  border:4px solid var(--line);border-radius:26px;box-shadow:0 8px 0 var(--line);padding:18px}
.resultado .txt{font:800 clamp(34px,5vw,64px)/1.05 var(--display);overflow-wrap:anywhere}
.resultado .vacio{color:var(--muted);font:800 22px var(--display)}
.resultado.nuevo{animation:salta .45s ease-out}
@keyframes salta{0%{transform:scale(.85)}70%{transform:scale(1.05)}100%{transform:scale(1)}}
.btn{border:3px solid var(--line);border-radius:18px;background:var(--panel);padding:10px 18px;
  font:800 20px var(--display);box-shadow:0 4px 0 var(--line)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.si{background:var(--yellow);font-size:26px;padding:12px 22px}
.btn[disabled]{opacity:.5;cursor:default;transform:none;box-shadow:0 4px 0 var(--line)}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.check{display:flex;align-items:center;gap:8px;font-weight:800}
.check input{width:22px;height:22px;accent-color:#6C5CE7}
.quedan{color:var(--muted);font-weight:800}
.editor{background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--line)}
.editor[hidden]{display:none}
label{display:block;font:800 20px var(--display);margin-bottom:4px}
.ayuda{color:var(--muted);font-size:16px;margin:0 0 8px}
textarea{width:100%;min-height:220px;border:3px solid var(--line);border-radius:14px;padding:10px;line-height:1.5;resize:vertical}
.error{color:var(--bad-ink);font-weight:800;margin:8px 0 0;min-height:1.2em}
@media (max-width:820px){.app{grid-template-columns:1fr;height:auto;padding-top:60px}.rueda{width:min(100%,420px)}}
@media (prefers-reduced-motion:reduce){.resultado.nuevo{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div class="rueda">
    <div class="flecha" aria-hidden="true"></div>
    <svg viewBox="-104 -104 208 208" role="img" aria-label="Ruleta">
      <g id="giro"></g>
      <circle r="13" fill="#FFE44D" stroke="#17130F" stroke-width="2.5"/>
    </svg>
  </div>

  <div class="lado">
    <div>
      <h1 id="titulo">Ruleta</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="resultado" id="resultado" aria-live="polite"><span class="vacio">Toca Girar</span></div>
    <div class="fila">
      <button class="btn si" id="girar">🎡 Girar</button>
      <button class="btn" id="reiniciar">↺ Reiniciar</button>
    </div>
    <div class="fila">
      <label class="check"><input type="checkbox" id="norepetir" checked> No repetir</label>
      <span class="quedan" id="quedan"></span>
      <button class="btn" id="editar" style="margin-left:auto">Editar lista</button>
    </div>
    <div class="editor" id="editor" hidden>
      <label for="lista">Lista de <span id="nomMateria"></span></label>
      <p class="ayuda">Una opción por línea: profesiones, nombres de estudiantes, preguntas o lo que necesites.</p>
      <textarea id="lista" spellcheck="false"></textarea>
      <p class="error" id="error" role="alert"></p>
      <div class="fila"><button class="btn si" id="guardar" style="font-size:20px;padding:10px 18px">Guardar</button>
      <button class="btn" id="cancelar">Cancelar</button></div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var params=new URLSearchParams(location.search);
var materia=params.get('materia')||'general';
var NOMBRES={adl:'ADL',mate:'Matemáticas',ciencias:'Ciencias',general:'la clase'};
var nombre=NOMBRES[materia]||materia;

var EJEMPLOS={
  ciencias:'Bióloga\nAstrónomo\nGeóloga\nQuímico\nMeteoróloga\nBotánico\nZoóloga\nOceanógrafo\nVeterinaria\nPaleontólogo'
};
var COLORES=['#E9E5FF','#D3F3E0','#FFF0C2','#FBDADD','#DDEFFD','#FFE3CC'];
var CLAVE='ruleta-v1';

var guardado={listas:{}};
try{var g=JSON.parse(localStorage.getItem(CLAVE)||'null');if(g&&g.listas)guardado=g;}catch(e){}
function persistir(){try{localStorage.setItem(CLAVE,JSON.stringify(guardado));}catch(e){}}

function textoLista(){return guardado.listas[materia]!=null?guardado.listas[materia]:(EJEMPLOS[materia]||'');}
function leer(t){return t.split('\n').map(function(s){return s.trim();}).filter(Boolean);}

var todos=[],disponibles=[],rot=0,girando=false;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function corto(s,n){return s.length>n?s.slice(0,n-1)+'…':s;}
function punto(r,a){var t=a*Math.PI/180;return [r*Math.sin(t),-r*Math.cos(t)];}

function dibujar(){
  var gEl=$('giro'),n=disponibles.length,html='';
  if(!n){
    html='<circle r="100" fill="#FFFFFF" stroke="#17130F" stroke-width="3"/>'+
      '<text y="-40" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="11" fill="#6B6558">'+(todos.length?'Ya salieron todas':'Lista vacía')+'</text>';
  }else if(n===1){
    html='<circle r="100" fill="'+COLORES[0]+'" stroke="#17130F" stroke-width="3"/>'+
      '<text y="-55" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="12" fill="#17130F">'+esc(corto(disponibles[0],18))+'</text>';
  }else{
    var a=360/n,fs=n<=6?11:n<=10?9.5:n<=16?8:n<=24?6.5:5.5,max=n<=10?16:n<=20?14:12;
    disponibles.forEach(function(item,i){
      var p1=punto(100,i*a),p2=punto(100,(i+1)*a),grande=a>180?1:0;
      var col=COLORES[i%COLORES.length];
      if(n%COLORES.length===1&&i===n-1)col=COLORES[1];
      html+='<path d="M0 0L'+p1[0].toFixed(2)+' '+p1[1].toFixed(2)+'A100 100 0 '+grande+' 1 '+p2[0].toFixed(2)+' '+p2[1].toFixed(2)+'Z" fill="'+col+'" stroke="#17130F" stroke-width="1.5"/>';
      var mid=i*a+a/2;
      html+='<g transform="rotate('+mid.toFixed(2)+')"><text x="0" y="-57" transform="rotate(-90 0 -57)" text-anchor="middle" dominant-baseline="central" '+
        'font-family="Baloo 2, sans-serif" font-weight="800" font-size="'+fs+'" fill="#17130F">'+esc(corto(item,max))+'</text></g>';
    });
    html+='<circle r="100" fill="none" stroke="#17130F" stroke-width="3"/>';
  }
  gEl.innerHTML=html;
  gEl.style.transition='none';
  gEl.style.transform='rotate('+rot+'deg)';
  $('quedan').textContent=$('norepetir').checked&&todos.length?'Quedan '+n+' de '+todos.length:'';
  $('girar').disabled=!n;
}

function cargar(){
  todos=leer(textoLista());
  disponibles=todos.slice();
  rot=0;
  $('resultado').innerHTML='<span class="vacio">'+(todos.length?'Toca Girar':'Escribe tu lista para empezar')+'</span>';
  dibujar();
  if(!todos.length)abrirEditor();
}

function girar(){
  var n=disponibles.length;if(girando||!n)return;
  girando=true;$('girar').disabled=true;
  var i=Math.floor(Math.random()*n),a=360/n;
  var centro=i*a+a/2+(Math.random()-0.5)*a*0.6;
  var objetivo=((360-centro)%360+360)%360;
  var actual=((rot%360)+360)%360;
  var reducir=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var vueltas=reducir?1:5;
  rot=rot+vueltas*360+((objetivo-actual)+360)%360;
  var gEl=$('giro');
  gEl.getBoundingClientRect();
  gEl.style.transition='transform '+(reducir?0.8:4.2)+'s cubic-bezier(.12,.72,.16,1)';
  gEl.style.transform='rotate('+rot+'deg)';
  $('resultado').innerHTML='<span class="vacio">Girando…</span>';
  setTimeout(function(){
    var item=disponibles[i];
    var r=$('resultado');r.classList.remove('nuevo');void r.offsetWidth;r.classList.add('nuevo');
    r.innerHTML='<div class="txt">'+esc(item)+'</div>';
    girando=false;
    if($('norepetir').checked){disponibles.splice(i,1);setTimeout(dibujar,1400);}
    else $('girar').disabled=false;
  },reducir?850:4300);
}

function abrirEditor(){$('lista').value=textoLista();$('error').textContent='';$('editor').hidden=false;$('lista').focus();}

$('titulo').textContent='Ruleta de '+nombre;
$('sub').textContent='Escoge al azar de tu lista.';
$('nomMateria').textContent=nombre;
$('girar').onclick=girar;
$('reiniciar').onclick=function(){if(girando)return;disponibles=todos.slice();$('resultado').innerHTML='<span class="vacio">Toca Girar</span>';dibujar();};
$('norepetir').onchange=function(){if(!girando){disponibles=todos.slice();dibujar();}};
$('editar').onclick=function(){if($('editor').hidden)abrirEditor();else $('editor').hidden=true;};
$('cancelar').onclick=function(){$('editor').hidden=true;};
$('guardar').onclick=function(){
  var t=$('lista').value,items=leer(t);
  if(items.length<2){$('error').textContent='Escribe al menos dos opciones.';return;}
  if(items.length>40){$('error').textContent='Máximo 40 opciones para que se puedan leer en la ruleta.';return;}
  guardado.listas[materia]=items.join('\n');persistir();
  $('editor').hidden=true;cargar();
};
$('lista').addEventListener('input',function(){$('error').textContent='';});
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='TEXTAREA')return;
  if(e.key===' '||e.key==='Enter'){if(e.target.tagName!=='BUTTON'){e.preventDefault();girar();}}
});

cargar();
})();
</script>
</body>
</html>
